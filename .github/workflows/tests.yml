name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest tested version, the version used in review, and the current release.
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile bundled scripts
        run: python -m compileall -q scripts
      - name: Run tests
        run: python -B -m unittest discover -s tests_current -v
      - name: Render and validate canonical synthetic audit report
        run: |
          python scripts/render_report.py examples/security-audit.md -o /tmp/twinthos-security-audit.html
          python scripts/check_report.py /tmp/twinthos-security-audit.html
